<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prompt Injection Detector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h2>🛡 Prompt Injection Detector</h2>

        <div class="status safe">
            Status:
            <span id="statusText">SAFE</span>
        </div>

        <div class="score-section">

            <p>Risk Score</p>

            <h1 id="riskScore">0%</h1>

            <div class="progress-bar">
                <div class="progress" id="progressFill"></div>
            </div>

        </div>

        <div class="last-scan">
            <strong>Last Scan</strong>
            <p id="scanResult">No prompt scanned yet.</p>
        </div>

        <button id="scanBtn">
            Scan Current Prompt
        </button>

    </div>

    <script src="popup.js"></script>

</body>
</html>
